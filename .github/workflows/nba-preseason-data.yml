name: NBA Preseason Live Data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * 10 *'

permissions:
  contents: write

concurrency:
  group: nba-preseason-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect ESPN and Kambi data
        shell: python
        run: |
          import json
          import time
          import urllib.request
          import urllib.parse
          from datetime import datetime, date, timedelta, timezone
          from pathlib import Path
          from collections import defaultdict

          OUT = Path("data")
          OUT.mkdir(exist_ok=True)

          ESPN = (
              "https://site.api.espn.com/apis/site/v2/"
              "sports/basketball/nba"
          )

          KAMBI = (
              "https://eu.offering-api.kambicdn.com"
              "/offering/v2018"
          )

          OFFERING = "pivusmsrl-bil"

          PARAM = {
              "lang": "en_US",
              "market": "US-MS",
              "client_id": "200",
              "channel_id": "7"
          }

          HEAD = {
              "Accept": "application/json",
              "User-Agent": "Mozilla/5.0"
          }

          NOW = datetime.now(timezone.utc).isoformat()
          errors = []

          def fetch(url, retries=3):
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers=HEAD
                      )

                      with urllib.request.urlopen(
                          req,
                          timeout=22
                      ) as response:
                          return json.load(response)

                  except Exception as exc:
                      if attempt == retries - 1:
                          errors.append({
                              "url": url.split("?")[0],
                              "error": str(exc)[:150]
                          })
                      else:
                          time.sleep(2 ** attempt)

              return None

          def save(name, data):
              path = OUT / name

              path.write_text(
                  json.dumps(
                      data,
                      indent=2,
                      ensure_ascii=False
                  ),
                  encoding="utf-8"
              )

              print("SAVED:", name)

          def n(value):
              try:
                  x = float(value)

                  if x.is_integer() and x >= 0:
                      return int(x)

              except (ValueError, TypeError):
                  pass

              return None

          def avg(rows, key):
              if not rows:
                  return None

              return round(
                  sum(x[key] for x in rows) / len(rows),
                  2
              )

          def parse_comp(c):
              lines = c.get("linescores") or []

              q = [
                  n(
                      x.get(
                          "value",
                          x.get("displayValue")
                      )
                  )
                  for x in lines
              ]

              final = n(c.get("score"))

              if len(q) < 4:
                  return None

              if any(x is None for x in q):
                  return None

              if final is None:
                  return None

              if sum(q) != final:
                  return None

              team = c.get("team", {})

              return {
                  "id": str(team.get("id", "")),
                  "team": team.get("displayName", ""),
                  "abbreviation": team.get(
                      "abbreviation",
                      ""
                  ),
                  "homeAway": c.get("homeAway", ""),
                  "quarters": q,
                  "q1": q[0],
                  "q2": q[1],
                  "q3": q[2],
                  "q4": q[3],
                  "firstHalf": sum(q[:2]),
                  "regulation": sum(q[:4]),
                  "fullGame": final,
                  "overtime": len(q) > 4
              }

          print(
              "===================================="
          )
          print("DOC'S NBA PRESEASON DATA ENGINE")
          print(
              "===================================="
          )

          today = datetime.now(timezone.utc).date()

          start = date(2026, 9, 20)
          end = min(
              today,
              date(2026, 11, 1)
          )

          games = {}
          failed_dates = []

          print("START DATE:", start)
          print("END DATE:", end)

          if end >= start:
              day = start

              while day <= end:
                  daystr = day.strftime("%Y%m%d")

                  query = urllib.parse.urlencode({
                      "dates": daystr,
                      "season": "2027",
                      "seasontype": "1",
                      "limit": "100"
                  })

                  url = (
                      ESPN
                      + "/scoreboard?"
                      + query
                  )

                  board = fetch(url)

                  if board is None:
                      failed_dates.append(daystr)

                  else:
                      for event in board.get(
                          "events",
                          []
                      ):
                          status = (
                              event.get("status", {})
                              .get("type", {})
                          )

                          if not status.get(
                              "completed",
                              False
                          ):
                              continue

                          season_type = (
                              event.get("season", {})
                              .get("type")
                          )

                          if (
                              season_type is not None
                              and str(season_type) != "1"
                          ):
                              continue

                          competitions = event.get(
                              "competitions",
                              []
                          )

                          if not competitions:
                              continue

                          competitors = (
                              competitions[0].get(
                                  "competitors",
                                  []
                              )
                          )

                          if len(competitors) != 2:
                              continue

                          parsed = [
                              parse_comp(c)
                              for c in competitors
                          ]

                          if any(
                              x is None
                              for x in parsed
                          ):
                              continue

                          away = next(
                              (
                                  x for x in parsed
                                  if x["homeAway"] == "away"
                              ),
                              None
                          )

                          home = next(
                              (
                                  x for x in parsed
                                  if x["homeAway"] == "home"
                              ),
                              None
                          )

                          if not away or not home:
                              continue

                          for own, opp in (
                              (away, home),
                              (home, away)
                          ):
                              own["q1Allowed"] = (
                                  opp["q1"]
                              )

                              own["firstHalfAllowed"] = (
                                  opp["firstHalf"]
                              )

                              own["fullGameAllowed"] = (
                                  opp["fullGame"]
                              )

                          gameid = str(
                              event.get("id", "")
                          )

                          if gameid:
                              games[gameid] = {
                                  "id": gameid,
                                  "date": event.get(
                                      "date",
                                      ""
                                  ),
                                  "away": away,
                                  "home": home,
                                  "source": "ESPN",
                                  "seasonType": "preseason"
                              }

                  day += timedelta(days=1)

          game_rows = sorted(
              games.values(),
              key=lambda g: (
                  g["date"],
                  g["id"]
              )
          )

          save(
              "preseason-games-2026.json",
              {
                  "generatedAt": NOW,
                  "source": "ESPN",
                  "season": "2026-27",
                  "seasonType": "preseason",
                  "games": game_rows
              }
          )

          teams = defaultdict(list)

          for game in game_rows:
              for side in ("away", "home"):
                  c = game[side]

                  teams[c["id"]].append({
                      **c,
                      "eventId": game["id"],
                      "date": game["date"]
                  })

          team_rows = []

          for team_id, rows in teams.items():
              home = [
                  r for r in rows
                  if r["homeAway"] == "home"
              ]

              away = [
                  r for r in rows
                  if r["homeAway"] == "away"
              ]

              def summarize(items):
                  return {
                      "games": len(items),
                      **{
                          key: avg(items, key)
                          for key in (
                              "q1",
                              "firstHalf",
                              "fullGame",
                              "q1Allowed",
                              "firstHalfAllowed",
                              "fullGameAllowed"
                          )
                      }
                  }

              team_rows.append({
                  "teamId": team_id,
                  "team": rows[0]["team"],
                  "abbreviation": rows[0][
                      "abbreviation"
                  ],
                  "all": summarize(rows),
                  "home": summarize(home),
                  "away": summarize(away),
                  "last5": summarize(
                      sorted(
                          rows,
                          key=lambda x: x["date"],
                          reverse=True
                      )[:5]
                  ),
                  "gameLogs": sorted(
                      rows,
                      key=lambda x: x["date"],
                      reverse=True
                  )
              })

          save(
              "preseason-teams-2026.json",
              {
                  "generatedAt": NOW,
                  "source": "ESPN",
                  "teams": sorted(
                      team_rows,
                      key=lambda x: x["team"]
                  )
              }
          )

          print(
              "ESPN GAMES:",
              len(game_rows)
          )

          print(
              "ESPN TEAMS:",
              len(team_rows)
          )

          player_games = defaultdict(list)
          player_names = {}
          summary_failures = []

          for game in game_rows:
              summary_url = (
                  ESPN
                  + "/summary?"
                  + urllib.parse.urlencode({
                      "event": game["id"]
                  })
              )

              summary = fetch(summary_url)

              if summary is None:
                  summary_failures.append(
                      game["id"]
                  )
                  continue

              boxscore = summary.get(
                  "boxscore",
                  {}
              )

              for group in boxscore.get(
                  "players",
                  []
              ):
                  team = group.get(
                      "team",
                      {}
                  )

                  for stats_group in group.get(
                      "statistics",
                      []
                  ):
                      labels = stats_group.get(
                          "labels",
                          []
                      )

                      for entry in stats_group.get(
                          "athletes",
                          []
                      ):
                          if entry.get(
                              "didNotPlay"
                          ):
                              continue

                          values = entry.get(
                              "stats",
                              []
                          )

                          if len(values) != len(labels):
                              continue

                          stats = dict(
                              zip(labels, values)
                          )

                          athlete = entry.get(
                              "athlete",
                              {}
                          )

                          pid = str(
                              athlete.get("id", "")
                          )

                          if not pid:
                              continue

                          player_names[pid] = (
                              athlete.get(
                                  "displayName",
                                  ""
                              )
                          )

                          def numeric_stat(key):
                              raw = stats.get(key)

                              if (
                                  key == "3PT"
                                  and raw is not None
                              ):
                                  raw = str(
                                      raw
                                  ).split("-")[0]

                              return n(raw)

                          vals = {
                              key: numeric_stat(src)
                              for key, src in (
                                  ("points", "PTS"),
                                  ("rebounds", "REB"),
                                  ("assists", "AST"),
                                  ("threes", "3PT")
                              )
                          }

                          if any(
                              v is None
                              for v in vals.values()
                          ):
                              continue

                          player_games[pid].append({
                              "eventId": game["id"],
                              "date": game["date"],
                              "teamId": str(
                                  team.get("id", "")
                              ),
                              "team": team.get(
                                  "displayName",
                                  ""
                              ),
                              **vals
                          })

          players = []

          for pid, rows in player_games.items():
              unique = {
                  r["eventId"]: r
                  for r in rows
              }

              logs = sorted(
                  unique.values(),
                  key=lambda x: x["date"],
                  reverse=True
              )

              players.append({
                  "playerId": pid,
                  "playerName": player_names.get(
                      pid,
                      ""
                  ),
                  "gamesPlayed": len(logs),
                  "team": logs[0]["team"],
                  "averages": {
                      k: avg(logs, k)
                      for k in (
                          "points",
                          "rebounds",
                          "assists",
                          "threes"
                      )
                  },
                  "gameLogs": logs
              })

          save(
              "preseason-players-2026.json",
              {
                  "generatedAt": NOW,
                  "source": "ESPN",
                  "players": sorted(
                      players,
                      key=lambda x: x["playerName"]
                  )
              }
          )

          print(
              "ESPN PLAYERS:",
              len(players)
          )

          base = (
              KAMBI
              + "/"
              + OFFERING
          )

          discovery = (
              base
              + "/listView/basketball/nba/"
              + "all/all/matches.json?"
              + urllib.parse.urlencode({
                  **PARAM,
                  "useCombined": "true",
                  "useCombinedLive": "true"
              })
          )

          match_data = fetch(discovery)
          kambi_events = []

          if isinstance(match_data, dict):
              for wrapper in match_data.get(
                  "events",
                  []
              ):
                  if not isinstance(
                      wrapper,
                      dict
                  ):
                      continue

                  event = wrapper.get(
                      "event",
                      {}
                  )

                  if (
                      isinstance(event, dict)
                      and event.get("id") is not None
                  ):
                      kambi_events.append({
                          "id": str(
                              event["id"]
                          ),
                          "name": event.get(
                              "name",
                              ""
                          ),
                          "start": event.get(
                              "start",
                              ""
                          )
                      })

          unique_events = {
              e["id"]: e
              for e in kambi_events
          }

          market_events = []

          for e in list(
              unique_events.values()
          )[:40]:
              offers_url = (
                  base
                  + "/betoffer/event/"
                  + urllib.parse.quote(
                      e["id"]
                  )
                  + ".json?"
                  + urllib.parse.urlencode({
                      **PARAM,
                      "includeParticipants": "true"
                  })
              )

              offers = fetch(
                  offers_url
              )

              if isinstance(
                  offers,
                  dict
              ):
                  market_events.append({
                      **e,
                      "betOffers": offers.get(
                          "betOffers",
                          []
                      )
                  })

          save(
              "preseason-markets-2026.json",
              {
                  "generatedAt": NOW,
                  "source": "Kambi",
                  "offering": OFFERING,
                  "market": "US-MS",
                  "events": market_events,
                  "note": (
                      "Raw offers. Match ESPN events "
                      "to Kambi by teams and scheduled "
                      "start, never by array index."
                  )
              }
          )

          status = {
              "generatedAt": NOW,
              "espnGames": len(game_rows),
              "espnTeams": len(team_rows),
              "espnPlayers": len(players),
              "espnFailedDates": failed_dates,
              "espnFailedSummaries": summary_failures,
              "kambiEvents": len(
                  unique_events
              ),
              "kambiEventsWithOffers": sum(
                  bool(x["betOffers"])
                  for x in market_events
              ),
              "errors": errors,
              "dataComplete": (
                  not failed_dates
                  and not summary_failures
              ),
              "bettingQualificationEnabled": False
          }

          save(
              "preseason-status.json",
              status
          )

          print(
              "FINAL STATUS:",
              json.dumps(
                  status,
                  indent=2
              )
          )

          if (
              failed_dates
              or summary_failures
          ):
              raise SystemExit(
                  "Incomplete ESPN fetch: "
                  "refusing partial update"
              )

      - name: Commit updated preseason data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/preseason-*.json

          if git diff --cached --quiet; then
            echo "No new preseason data to commit."
          else
            git commit -m "Update NBA preseason ESPN and Kambi data"
            git push
          fi
