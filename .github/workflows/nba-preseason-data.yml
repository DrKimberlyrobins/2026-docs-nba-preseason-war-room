
name: NBA Preseason Live Data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * 10 *'

permissions:
  contents: write

concurrency:
  group: nba-preseason-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect ESPN and Kambi data
        shell: python
        run: |
          import json
          import time
          import urllib.request
          import urllib.parse
          from datetime import datetime, date, timedelta, timezone
          from pathlib import Path
          from collections import defaultdict

          OUT = Path("data")
          OUT.mkdir(exist_ok=True)

          ESPN = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba"
          KAMBI = "https://eu.offering-api.kambicdn.com/offering/v2018"
          OFFERING = "pivusmsrl-bil"

          PARAM = {
              "lang": "en_US",
              "market": "US-MS",
              "client_id": "200",
              "channel_id": "7"
          }

          HEAD = {
              "Accept": "application/json",
              "User-Agent": "Mozilla/5.0"
          }

          NOW = datetime.now(timezone.utc).isoformat()
          errors = []

          def fetch(url, retries=3):
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(url, headers=HEAD)
                      with urllib.request.urlopen(req, timeout=22) as response:
                          return json.load(response)
                  except Exception as exc:
                      if attempt == retries - 1:
                          errors.append({
                              "url": url.split("?")[0],
                              "error": str(exc)[:150]
                          })
                      else:
                          time.sleep(2 ** attempt)
              return None

          def save(name, data):
              (OUT / name).write_text(
                  json.dumps(data, indent=2, ensure_ascii=False),
                  encoding="utf-8"
              )
              print("SAVED", name)

          def n(value):
              try:
                  x = float(value)
                  return int(x) if x.is_integer() and x >= 0 else None
              except (ValueError, TypeError):
                  return None

          def avg(rows, key):
              return (
                  round(sum(x[key] for x in rows) / len(rows), 2)
                  if rows else None
              )

          def parse_comp(c):
              lines = c.get("linescores") or []
              q = [
                  n(x.get("value", x.get("displayValue")))
                  for x in lines
              ]
              final = n(c.get("score"))

              if len(q) < 4 or any(x is None for x in q):
                  return None
              if final is None or sum(q) != final:
                  return None

              return {
                  "id": str(c.get("team", {}).get("id", "")),
                  "team": c.get("team", {}).get("displayName", ""),
                  "abbreviation": c.get("team", {}).get("abbreviation", ""),
                  "homeAway": c.get("homeAway", ""),
                  "quarters": q,
                  "q1": q[0],
                  "firstHalf": sum(q[:2]),
                  "fullGame": final,
                  "overtime": len(q) > 4
              }

          today = datetime.now(timezone.utc).date()
          start = date(2026, 9, 20)
          end = min(today, date(2026, 11, 1))

          games = {}
          failed_dates = []

          if end >= start:
              day = start

              while day <= end:
                  daystr = day.strftime("%Y%m%d")

                  query = urllib.parse.urlencode({
                      "dates": daystr,
                      "season": "2027",
                      "seasontype": "1",
                      "limit": "100"
                  })

                  board = fetch(ESPN + "/scoreboard?" + query)

                  if board is None:
                      failed_dates.append(daystr)
                  else:
                      for event in board.get("events", []):
                          if not event.get("status", {}).get("type", {}).get("completed"):
                              continue

                          season_type = event.get("season", {}).get("type")
                          if season_type is not None and str(season_type) != "1":
                              continue

                          competitors = (
                              (event.get("competitions") or [{}])[0]
                              .get("competitors", [])
                          )

                          if len(competitors) != 2:
                              continue

                          parsed = [parse_comp(c) for c in competitors]

                          if any(x is None for x in parsed):
                              continue

                          away = next(
                              (x for x in parsed if x["homeAway"] == "away"),
                              None
                          )
                          home = next(
                              (x for x in parsed if x["homeAway"] == "home"),
                              None
                          )

                          if not away or not home:
                              continue

                          for own, opp in ((away, home), (home, away)):
                              own["q1Allowed"] = opp["q1"]
                              own["firstHalfAllowed"] = opp["firstHalf"]
                              own["fullGameAllowed"] = opp["fullGame"]

                          gameid = str(event.get("id", ""))

                          if gameid:
                              games[gameid] = {
                                  "id": gameid,
                                  "date": event.get("date", ""),
                                  "away": away,
                                  "home": home,
                                  "source": "ESPN",
                                  "seasonType": "preseason"
                              }

                  day += timedelta(days=1)

          game_rows = sorted(
              games.values(),
              key=lambda g: (g["date"], g["id"])
          )

          save("preseason-games-2026.json", {
              "generatedAt": NOW,
              "source": "ESPN",
              "season": "2026-27",
              "seasonType": "preseason",
              "games": game_rows
          })

          teams = defaultdict(list)

          for game in game_rows:
              for side in ("away", "home"):
                  c = game[side]
                  teams[c["id"]].append({
                      **c,
                      "eventId": game["id"],
                      "date": game["date"]
                  })

          team_rows = []

          for team_id, rows in teams.items():
              home = [r for r in rows if r["homeAway"] == "home"]
              away = [r for r in rows if r["homeAway"] == "away"]

              def summarize(items):
                  return {
                      "games": len(items),
                      **{
                          key: avg(items, key)
                          for key in (
                              "q1",
                              "firstHalf",
                              "fullGame",
                              "q1Allowed",
                              "firstHalfAllowed",
                              "fullGameAllowed"
                          )
                      }
                  }

              team_rows.append({
                  "teamId": team_id,
                  "team": rows[0]["team"],
                  "abbreviation": rows[0]["abbreviation"],
                  "all": summarize(rows),
                  "home": summarize(home),
                  "away": summarize(away),
                  "last5": summarize(
                      sorted(
                          rows,
                          key=lambda x: x["date"],
                          reverse=True
                      )[:5]
                  ),
                  "gameLogs": sorted(
                      rows,
                      key=lambda x: x["date"],
                      reverse=True
                  )
              })

          save("preseason-teams-2026.json", {
              "generatedAt": NOW,
              "source": "ESPN",
              "teams": sorted(team_rows, key=lambda x: x["team"])
          })

          player_games = defaultdict(list)
          summary_failures = []

          for game in game_rows:
              summary = fetch(
                  ESPN + "/summary?" +
                  urllib.parse.urlencode({"event": game["id"]})
              )

              if summary is None:
                  summary_failures.append(game["id"])
                  continue

              for group in summary.get("boxscore", {}).get("players", []):
                  team = group.get("team", {})

                  for stats_group in group.get("statistics", []):
                      labels = stats_group.get("labels", [])

                      for entry in stats_group.get("athletes", []):
                          if entry.get("didNotPlay"):
                              continue

                          values = entry.get("stats", [])

                          if len(values) != len(labels):
                              continue

                          stats = dict(zip(labels, values))
                          athlete = entry.get("athlete", {})
                          pid = str(athlete.get("id", ""))

                          if not pid:
                              continue

                          def numeric_stat(key):
                              raw = stats.get(key)

                              if key == "3PT" and raw is not None:
                                  raw = str(raw).split("-")[0]

                              return n(raw)

                          vals = {
                              key: numeric_stat(src)
                              for key, src in (
                                  ("points", "PTS"),
                                  ("rebounds", "REB"),
                                  ("assists", "AST"),
                                  ("threes", "3PT")
                              )
                          }

                          if any(v is None for v in vals.values()):
                              continue

                          player_games[pid].append({
                              "eventId": game["id"],
                              "date": game["date"],
                              "teamId": str(team.get("id", "")),
                              "team": team.get("displayName", ""),
                              **vals
                          })

          players = []

          for pid, rows in player_games.items():
              unique = {r["eventId"]: r for r in rows}

              logs = sorted(
                  unique.values(),
                  key=lambda x: x["date"],
                  reverse=True
              )

              players.append({
                  "playerId": pid,
                  "gamesPlayed": len(logs),
                  "team": logs[0]["team"],
                  "averages": {
                      k: avg(logs, k)
                      for k in ("points", "rebounds", "assists", "threes")
                  },
                  "gameLogs": logs
              })

          save("preseason-players-2026.json", {
              "generatedAt": NOW,
              "source": "ESPN",
              "note": "Player names not guaranteed in this first data schema; use playerId for identity.",
              "players": players
          })

          base = KAMBI + "/" + OFFERING

          discovery = (
              base +
              "/listView/basketball/nba/all/all/matches.json?" +
              urllib.parse.urlencode({
                  **PARAM,
                  "useCombined": "true",
                  "useCombinedLive": "true"
              })
          )

          match_data = fetch(discovery)
          kambi_events = []

          if isinstance(match_data, dict):
              for wrapper in match_data.get("events", []):
                  event = (
                      wrapper.get("event", {})
                      if isinstance(wrapper, dict)
                      else {}
                  )

                  if isinstance(event, dict) and event.get("id") is not None:
                      kambi_events.append({
                          "id": str(event["id"]),
                          "name": event.get("name", ""),
                          "start": event.get("start", "")
                      })

          unique_events = {e["id"]: e for e in kambi_events}
          market_events = []

          for e in list(unique_events.values())[:40]:
              url = (
                  base +
                  "/betoffer/event/" +
                  urllib.parse.quote(e["id"]) +
                  ".json?" +
                  urllib.parse.urlencode({
                      **PARAM,
                      "includeParticipants": "true"
                  })
              )

              offers = fetch(url)

              if isinstance(offers, dict):
                  market_events.append({
                      **e,
                      "betOffers": offers.get("betOffers", [])
                  })

          save("preseason-markets-2026.json", {
              "generatedAt": NOW,
              "source": "Kambi",
              "offering": OFFERING,
              "market": "US-MS",
              "events": market_events,
              "note": "Raw offers. Match ESPN events to Kambi by teams and scheduled start; never by array index."
          })

          status = {
              "generatedAt": NOW,
              "espnGames": len(game_rows),
              "espnTeams": len(team_rows),
              "espnPlayers": len(players),
              "espnFailedDates": failed_dates,
              "espnFailedSummaries": summary_failures,
              "kambiEvents": len(unique_events),
              "kambiEventsWithOffers": sum(
                  bool(x["betOffers"]) for x in market_events
              ),
              "errors": errors,
              "dataComplete": not failed_dates and not summary_failures,
              "bettingQualificationEnabled": False
          }

          save("preseason-status.json", status)

          print("STATUS:", json.dumps(status, indent=2))

          if failed_dates or summary_failures:
              raise SystemExit(
                  "Incomplete ESPN fetch: refusing to publish partial update"
              )

      - name: Commit updated preseason data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/preseason-*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update NBA preseason ESPN and Kambi data'
            git push
